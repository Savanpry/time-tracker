<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StellarTime | Premium Project Time Tracker</title>
    <meta name="description" content="A premium, focused multi-project time tracking dashboard with beautiful analytics, manual entry, customizable hourly rates, and secure local storage.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Ambient Background Glows for Glassmorphism -->
        <div class="bg-glows">
            <div class="bg-glow-1"></div>
            <div class="bg-glow-2"></div>
        </div>

        <main class="main-content">
            <!-- Header Bar -->
            <header class="topbar">
                <div class="logo-container">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="logo-text">StellarTime</div>
                </div>
                <button class="btn-nuke" id="btn-reset-all" title="Permanently erase all projects and time logs">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                    <span>Reset All Data</span>
                </button>
            </header>

            <div class="dashboard-viewport">
                <!-- Top Row: Total Time Spent & Add Project Form -->
                <div class="top-row-grid">
                    <!-- Total Time Display Card -->
                    <div class="glass-card total-time-card">
                        <span class="card-label">Total Time Tracked</span>
                        <div class="total-time-clock" id="total-time-display">00:00:00</div>
                    </div>

                    <!-- Add Project Form Card -->
                    <div class="glass-card add-project-card">
                        <span class="card-label">Create New Project</span>
                        <form id="add-project-form" class="add-project-form" onsubmit="event.preventDefault();">
                            <div class="input-group">
                                <input type="text" id="new-project-name" placeholder="What project are you tracking?" required autocomplete="off">
                                <button type="submit" class="btn-add-project" id="btn-add-project">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                        <line x1="12" y1="5" x2="12" y2="19"></line>
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                    </svg>
                                    <span>Add Project</span>
                                </button>
                            </div>
                            <!-- Color Picker Preset Selection -->
                            <div class="color-picker-section">
                                <span class="picker-label">Color Accent:</span>
                                <div class="color-presets" id="color-presets-container">
                                    <!-- Populated via JS -->
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Projects section -->
                <div class="projects-section-header">
                    <h2 class="section-title">Projects</h2>
                </div>

                <!-- Projects Grid -->
                <div class="projects-grid" id="projects-grid">
                    <!-- Dynamic Projects List or Empty State -->
                </div>
            </div>
        </main>
    </div>

    <!-- Confirm Reset Dialog Overlay -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-window">
            <header class="modal-header">
                <h3 class="modal-title">Reset All Data?</h3>
            </header>
            <div class="modal-body">
                <p>This action is destructive and cannot be undone. All your projects and tracked times will be permanently deleted.</p>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="btn-confirm-cancel">Cancel</button>
                <button class="btn-confirm-danger" id="btn-confirm-proceed">Yes, Reset Everything</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
